name: order-api-showcase

services:
  mysql:
    # Oracle's official community image is used because it is also documented
    # in the MySQL 8.4 manual and avoids relying on a third-party mirror.
    image: container-registry.oracle.com/mysql/community-server:8.4
    container_name: order-api-showcase-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME must be set}
      MYSQL_USER: ${DB_USER:?DB_USER must be set}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      # Remote root access is limited by the host-only published port and is
      # needed only to create isolated databases for local integration tests.
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST:-%}
      TZ: UTC
    ports:
      - "127.0.0.1:${DB_PORT:-13307}:3306"
    volumes:
      - order_api_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=tcp -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" --batch --skip-column-names -e \"SELECT 1\" | grep -qx 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    stop_grace_period: 30s

volumes:
  order_api_mysql_data:
    name: order-api-showcase-mysql-data
